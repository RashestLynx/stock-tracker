name: StockTracker
options:
  bundleIdPrefix: com.rashestlynx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StockTracker:
    type: application
    platform: iOS
    sources: [StockTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashestlynx.stocktracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StockTracker/Info.plist
      properties:
        CFBundleDisplayName: Stock Tracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.rashestlynx.stocktracker.refresh]

name: StockTracker
options:
  bundleIdPrefix: com.rashestlynx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  StockTracker:
    type: application
    platform: iOS
    sources: [StockTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashestlynx.stocktracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: StockTracker/Info.plist
      properties:
        CFBundleDisplayName: Stock Tracker
        NSFaceIDUsageDescription: Face ID keeps your accounts and holdings private.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.rashestlynx.stocktracker.refresh]
  # Simulator smoke test: opens every tab and every view and fails if the app crashes.
  StockTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StockTrackerUITests]
    dependencies:
      - target: StockTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: StockTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.rashestlynx.stocktracker.uitests
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  StockTracker:
    build:
      targets:
        StockTracker: all
        StockTrackerUITests: [test]
    test:
      targets: [StockTrackerUITests]

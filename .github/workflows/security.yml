name: Security check

# Looks for leaked keys and passwords, and for common security mistakes in the Android and iPhone code.
# Runs on every push and every Monday. Results are on the run's summary page (Actions → Security check).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scanners
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
          pip install --quiet mobsfscan

      - name: Keys and passwords in the current code
        id: current
        run: ./gitleaks dir . --redact --no-banner --report-format json --report-path current.json --exit-code 0

      - name: Keys and passwords anywhere in the history
        run: ./gitleaks git . --redact --no-banner --report-format json --report-path history.json --exit-code 0

      - name: Mobile app code checks
        run: mobsfscan --config .mobsf app/src ios --json -o mobsf.json || true

      - name: Write the report
        run: |
          python3 - <<'PY'
          import json, os
          def load(p, default):
              try:
                  return json.load(open(p))
              except Exception:
                  return default
          current = load("current.json", []) or []
          history = load("history.json", []) or []
          mobsf = (load("mobsf.json", {}) or {}).get("results", {})
          bad = [k for k, v in mobsf.items() if v["metadata"].get("severity") in ("ERROR", "WARNING")]
          out = ["# Security check", ""]
          out.append("## Keys and passwords in the current code")
          if current:
              out.append(f"**{len(current)} found. Fix these first.** Move each one into the app's Settings, then make a new key on that service's website.")
              out += [f"- `{f['File']}` line {f['StartLine']} ({f['RuleID']})" for f in current]
          else:
              out.append("None found.")
          out += ["", "## Keys and passwords in old commits"]
          if history:
              out.append(f"{len(history)} found in the history. Anyone who can see the repository can still read these, so make a new key on each service's website (the old one stops working).")
              out += [f"- `{f['File']}` (commit {f['Commit'][:7]}, {f['RuleID']})" for f in history]
          else:
              out.append("None found.")
          out += ["", "## Mobile app code checks (MobSF)"]
          for sev in ("ERROR", "WARNING", "INFO"):
              for k, v in mobsf.items():
                  m = v["metadata"]
                  if m.get("severity") != sev:
                      continue
                  files = ", ".join(f"`{f['file_path']}`:{f['match_lines'][0]}" for f in v.get("files", [])[:3])
                  out.append(f"- **{sev}** {k}: {m.get('description', '')}" + (f" ({files})" if files else ""))
          if not mobsf:
              out.append("Nothing flagged.")
          out += ["", "INFO items are hardening ideas, not problems. ERROR and WARNING items are worth fixing."]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("\n".join(out) + "\n")
          # Fail the check (red X) only for problems in the current code, so it's easy to spot.
          if current or bad:
              raise SystemExit(1)
          PY

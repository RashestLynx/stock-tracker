name: Daily data check

# Every morning, checks that each free data source the app uses still works the way the app expects.
# If one breaks, this run fails and GitHub emails you, so it can be fixed before you notice in the app.
on:
  schedule:
    - cron: "41 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every data source
        run: python3 tests/health.py

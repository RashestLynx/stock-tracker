name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild -project StockTracker.xcodeproj -scheme StockTracker \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            tail -40 build.log
            exit 1
          fi

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StockTracker.app Payload/
          zip -qry StockTracker.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockTracker-ipa
          path: ios/StockTracker.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Android: download TradeTracker.apk. iPhone: download StockTracker.ipa and install it with Sideloadly (see README)."
          gh release upload latest ios/StockTracker.ipa --clobber

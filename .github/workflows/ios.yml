name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild -project StockTracker.xcodeproj -scheme StockTracker \
              -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -40 | sed 's/^/::error::/'
            tail -40 build.log
            exit 1
          fi

      # Before publishing: run the app on an iPhone simulator and tap through every tab and view.
      # If it crashes, the download link keeps the previous working version.
      - name: Test on an iPhone simulator
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM"
          if ! xcodebuild -project StockTracker.xcodeproj -scheme StockTracker \
              -destination "id=$SIM" -derivedDataPath simbuild \
              CODE_SIGNING_ALLOWED=NO -resultBundlePath smoke.xcresult \
              test > test.log 2>&1; then
            grep -E "error:|failed|crashed|XCTAssert|Fail" test.log | sort -u | head -40 | sed 's/^/::error::/'
            tail -60 test.log
            exit 1
          fi
          grep -E "Test Case|Executed" test.log | tail -5

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-smoke-test
          path: ios/smoke.xcresult
          if-no-files-found: ignore

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StockTracker.app Payload/
          zip -qry StockTracker.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockTracker-ipa
          path: ios/StockTracker.ipa

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Android: download TradeTracker.apk. iPhone: download StockTracker.ipa and install it with Sideloadly (see README)."
          gh release upload latest ios/StockTracker.ipa --clobber

name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "README.md", "tests/ios_smoke.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Before anything is published: install the app on an Android emulator and open every screen,
      # with and without a PIN set. If it crashes, the download link keeps the previous working version.
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            pip install --quiet pillow || true
            python3 tests/smoke.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeTracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TradeTracker.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Android: download TradeTracker.apk. iPhone: download StockTracker.ipa and install it with Sideloadly (see README)."
          gh release upload latest TradeTracker.apk --clobber

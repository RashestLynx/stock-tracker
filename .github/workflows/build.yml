name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeTracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TradeTracker.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Android: download TradeTracker.apk. iPhone: download StockTracker.ipa and install it with Sideloadly (see README)."
          gh release upload latest TradeTracker.apk --clobber
